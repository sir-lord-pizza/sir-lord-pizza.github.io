<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🍕</title>
  <meta name="description" content="Still in the oven. Pineapple is a breaking change.">
  <meta name="theme-color" content="#8f2312">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://devtesting.pizza/">
  <meta property="og:site_name" content="devtesting.pizza">
  <meta property="og:title" content="🍕 devtesting.pizza">
  <meta property="og:description" content="Still in the oven. Pineapple is a breaking change.">
  <meta property="og:image" content="https://devtesting.pizza/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A big pizza slice on a tomato red background">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #8f2312;
      --ink: #f6e2c8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      height: 100svh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Archivo Narrow", "Arial Narrow", sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      overflow: hidden;
    }
    h1 {
      margin: 0;
      font-size: min(60vw, 60vh);
      line-height: 1;
      animation: turn 90s linear infinite;
      user-select: none;
    }
    @keyframes turn { to { transform: rotate(360deg); } }
    .corner {
      position: fixed;
      margin: 0;
      font-size: clamp(0.8rem, 1.6vw, 1.1rem);
    }
    .tl { top: 20px; left: 20px; }
    .tr { top: 20px; right: 20px; text-align: right; }
    .bl { bottom: 20px; left: 20px; }
    .br { bottom: 20px; right: 20px; text-align: right; font-weight: 500; }
    @media (prefers-reduced-motion: reduce) {
      h1 { animation: none; }
    }
  </style>
</head>
<body>
  <p class="corner tl">devtesting.pizza</p>
  <p class="corner tr">Est. 2019</p>
  <h1>🍕</h1>
  <p class="corner bl">Still in the oven</p>
  <p class="corner br">Pineapple is<br>a breaking change.</p>
</body>
</html>
